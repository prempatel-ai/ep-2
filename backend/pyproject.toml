[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sahayak"
version = "0.1.0"
description = "Offline multilingual voice information assistant: backend service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Retrieval over the verified FAQ set.
rag = ["chromadb>=0.5", "sentence-transformers>=3.0"]
# Speech-to-text backends (install the one you configure).
stt-whisper = ["faster-whisper>=1.0"]
stt-indic = ["transformers>=4.44", "torch>=2.2", "torchaudio>=2.2", "onnxruntime>=1.17"]
# Text-to-speech backends (install the one you configure).
tts-mms = ["transformers>=4.44", "torch>=2.2"]
tts-parler = ["transformers>=4.44", "torch>=2.2", "parler-tts"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
sahayak-index = "sahayak.cli.build_index:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sahayak"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
